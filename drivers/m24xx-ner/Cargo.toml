[package]
name = "m24xx-ner"
version = "0.1.0"
edition = "2024"

[dependencies]
defmt = { workspace = true, optional = true }
embedded-hal.workspace = true
embedded-hal-async.workspace = true
embedded-storage-async = { version = "0.4.2", optional = true }
m24xx-ner-macros = { path = "./m24xx-ner-macros", optional = true }

[features]
default = ["storage", "defmt"]
storage = ["dep:embedded-storage-async", "dep:m24xx-ner-macros"]
defmt = ["dep:defmt"]

[lints]
workspace = true
