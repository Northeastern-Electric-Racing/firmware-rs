[package]
name = "can-handler"
version = "0.1.0"
edition = "2024"

[dependencies]
# right now this requires this exact version stm as it is register based
embassy-executor = { version = "0.10.0", features = ["executor-thread", "executor-interrupt", "platform-cortex-m"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32h563zi", "defmt"] }
embassy-sync = "0.8.0"

defmt.workspace = true
embedded-can.workspace = true
heapless = "0.9.3"
embassy-time.workspace = true
embassy-futures = "0.1.2"
defmt-monitor = { git = "https://github.com/bjackson312006/defmt-monitor.git", branch = "main", optional = true }

[features]
defmt-monitor = ["dep:defmt-monitor", "embassy-stm32/unstable-pac"]

[lints]
workspace = true
