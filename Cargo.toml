[workspace]
members = ["drivers/*", "platform/*", "utilities/*", "boot-control"]
resolver = "3"

# Keep standalone host tools outside embedded workspace builds.
exclude = ["utilities/cangen/cangen-macro", "utilities/can-flash-cli"]

[workspace.dependencies]
defmt = "1"

embedded-hal = { version = "1" }
embedded-hal-async = { version = "1" }
embedded-can = "0.4.1"
bitfield-struct = "0.13"
embassy-time = { version = "0.5.1", features = ["defmt"] }

[workspace.lints.clippy]
all = { level = "allow", priority = -2 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
disallowed_types = "deny"
default_numeric_fallback = "warn"
